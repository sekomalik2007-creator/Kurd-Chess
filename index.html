
<!DOCTYPE html>
<html lang="ku">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KurdChess</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial;text-align:center;padding:18px}
h1{color:#e5c17b}
button,select{padding:11px;margin:4px;border:0;border-radius:8px;background:#26364d;color:white;font-size:14px}
button{cursor:pointer}
button:active{background:#b99452}
.board{width:min(94vw,500px);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);margin:20px auto;border:5px solid #34445b}
.square{display:flex;align-items:center;justify-content:center;position:relative;font-size:clamp(25px,8vw,55px);padding:0;border-radius:0}
.light{background:#e8dfcb}
.dark{background:#718b7d}
.selected{background:#e6cb52}
.dot:after{content:"";position:absolute;width:20%;height:20%;border-radius:50%;background:#263c38}
.whitepiece{color:white;text-shadow:1px 2px 3px black}
.blackpiece{color:#171717}
#status{color:#e5c17b;font-size:18px;margin:15px}
.panel{max-width:500px;margin:auto}
</style>
</head>
<body>

<h1>♟ KurdChess ♟</h1>
<p id="subtitle">شەترەنج و زیرەکی دەستکرد</p>

<button onclick="setLang('ku')">کوردی</button>
<button onclick="setLang('en')">English</button>
<br>
<button onclick="newGame()">یاریی نوێ</button>
<button onclick="undo()">گەڕاندنەوە</button>
<button onclick="startPuzzle()">مەتەڵ</button>
<br>

<select id="level">
<option value="easy">ئاسان / Easy</option>
<option value="medium">مامناوەند / Medium</option>
<option value="hard">قورس / Hard</option>
</select>

<div id="status">نۆرەی تۆیە</div>
<div class="board" id="board"></div>
<div class="panel">
<p id="moves">جوڵەکان: 0</p>
<button onclick="showHint()">نیشانە / Hint</button>
</div>

<script>
const game = new Chess();

const pieces = {
wk:"♔",wq:"♕",wr:"♖",wb:"♗",wn:"♘",wp:"♙",
bk:"♚",bq:"♛",br:"♜",bb:"♝",bn:"♞",bp:"♟"
};

let selected=null;
let targets=[];
let language="ku";
let puzzle=false;
let solved=false;
let puzzleSolution="Qxg7#";
let thinking=false;

const words={
ku:{
turn:"نۆرەی تۆیە",ai:"AI بیر دەکاتەوە...",
win:"تۆ بردتەوە!",lose:"AI بردیەوە!",
draw:"یەکسان!",check:"کیش!",
correct:"ئافەرین! وەڵامی دروستە!",
wrong:"هەڵەیە! دووبارە هەوڵ بدە!",
hint:"وەزیرەکەت بۆ g7 بجوڵێنە!",
moves:"جوڵەکان"
},
en:{
turn:"Your turn",ai:"AI is thinking...",
win:"You won!",lose:"AI won!",
draw:"Draw!",check:"Check!",
correct:"Correct! Excellent!",
wrong:"Wrong move! Try again!",
hint:"Move your queen to g7!",
moves:"Moves"
}
};

function setLang(l){
language=l;
document.documentElement.lang=l;
document.documentElement.dir=l==="ku"?"rtl":"ltr";
document.getElementById("subtitle").innerText=
l==="ku"?"شەترەنج و زیرەکی دەستکرد":"Chess and Artificial Intelligence";
render();
}

function render(){
const el=document.getElementById("board");
el.innerHTML="";
const position=game.board();

for(let r=0;r<8;r++){
for(let c=0;c<8;c++){
const name="abcdefgh"[c]+(8-r);
const piece=position[r][c];
const sq=document.createElement("button");

sq.className="square "+((r+c)%2?"dark":"light");

if(selected===name)sq.classList.add("selected");
if(targets.includes(name))sq.classList.add("dot");

if(piece){
sq.innerHTML=`<span class="${piece.color==="w"?"whitepiece":"blackpiece"}">${pieces[piece.color+piece.type]}</span>`;
}

sq.onclick=()=>clickSquare(name);
el.appendChild(sq);
}
}

document.getElementById("moves").innerText=
words[language].moves+": "+game.history().length;
}

function status(message){
document.getElementById("status").innerText=message;
}

function clickSquare(name){
if(game.isGameOver()||thinking||game.turn()!=="w")return;

if(selected&&targets.includes(name)){
makeMove(selected,name);
return;
}

const piece=game.get(name);

if(piece&&piece.color==="w"){
selected=name;
targets=game.moves({square:name,verbose:true}).map(m=>m.to);
}else{
selected=null;
targets=[];
}
render();
}

function makeMove(from,to){
let move;

try{
move=game.move({from,to,promotion:"q"});
}catch(e){return;}

if(!move)return;

selected=null;
targets=[];

if(puzzle){
if(move.san===puzzleSolution){
solved=true;
status(words[language].correct);
}else{
status(words[language].wrong);
render();
setTimeout(startPuzzle,1000);
return;
}
render();
return;
}

render();
if(!game.isGameOver()){
thinking=true;
status(words[language].ai);
setTimeout(aiMove,400);
}
}

function aiMove(){
if(game.isGameOver()){
thinking=false;
return;
}

const moves=game.moves({verbose:true});
const level=document.getElementById("level").value;

let move;

if(level==="easy"){
move=moves[Math.floor(Math.random()*moves.length)];
}else{
move=bestMove(moves,level==="medium"?1:2);
}

if(move)game.move(move);

thinking=false;
render();
updateStatus();
}

function evaluate(){
const values={p:100,n:320,b:330,r:500,q:900,k:20000};
let score=0;

game.board().forEach(row=>{
row.forEach(p=>{
if(p)score+=(p.color==="b"?1:-1)*values[p.type];
});
});

return score;
}

function minimax(depth,alpha,beta,max){
if(depth===0||game.isGameOver())return evaluate();

const moves=game.moves();

if(max){
let best=-Infinity;
for(const m of moves){
game.move(m);
best=Math.max(best,minimax(depth-1,alpha,beta,false));
game.undo();
alpha=Math.max(alpha,best);
if(beta<=alpha)break;
}
return best;
}else{
let best=Infinity;
for(const m of moves){
game.move(m);
best=Math.min(best,minimax(depth-1,alpha,beta,true));
game.undo();
beta=Math.min(beta,best);
if(beta<=alpha)break;
}
return best;
}
}

function bestMove(moves,depth){
let best=-Infinity;
let choice=moves[0];

for(const m of moves){
game.move(m);
const score=minimax(depth-1,-Infinity,Infinity,false);
game.undo();

if(score>best){
best=score;
choice=m;
}
}
return choice;
}

function updateStatus(){
if(game.isCheckmate()){
status(game.turn()==="b"?words[language].win:words[language].lose);
}else if(game.isDraw()){
status(words[language].draw);
}else if(game.isCheck()){
status(words[language].check);
}else{
status(words[language].turn);
}
}

function newGame(){
game.reset();
selected=null;
targets=[];
puzzle=false;
solved=false;
thinking=false;
status(words[language].turn);
render();
}

function undo(){
if(thinking||game.history().length===0)return;
game.undo();
if(game.history().length>0)game.undo();
selected=null;
targets=[];
render();
updateStatus();
}

function startPuzzle(){
game.load("7k/6pp/8/5KQ1/8/8/8/6R1 w - - 0 1");
puzzle=true;
solved=false;
selected=null;
targets=[];
puzzleSolution="Qxg7#";
status(language==="ku"?"مەتەڵ: مات لە یەک جوڵەدا":"Puzzle: Mate in one");
render();
}

function showHint(){
status(words[language].hint);
}

newGame();
</script>
</body>
</html>
